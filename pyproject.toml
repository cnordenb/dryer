[project]
name = "dryer"
version = "0.1.0"
description = "Structural duplicate finder for Clojure, Java, Go, TypeScript, JavaScript, Rust, Python, and C."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
dryer = "dryer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
